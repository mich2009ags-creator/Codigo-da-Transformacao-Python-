<!DOCTYPE html>
<html>
<head>
    <title>{% if produto %}Editar{% else %}Novo{% endif %} Produto</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f4f4f4; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; }
        h1 { margin-bottom: 20px; color: #333; }
        form { display: flex; flex-direction: column; gap: 15px; }
        input, textarea { padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        textarea { resize: vertical; }
        button { padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .cancelar { display: inline-block; margin-top: 10px; text-align: center; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{% if produto %}✏️ Editar{% else %}➕ Novo{% endif %} Produto</h1>
        
        <form method="post">
            {% csrf_token %}
            <input type="text" name="nome" placeholder="Nome do produto" value="{{ produto.nome }}" required>
            <textarea name="descricao" placeholder="Descrição do produto" rows="4">{{ produto.descricao }}</textarea>
            <input type="number" name="preco" step="0.01" placeholder="Preço (R$)" value="{{ produto.preco }}" required>
            <input type="number" name="quantidade" placeholder="Quantidade em estoque" value="{{ produto.quantidade }}" required>
            <button type="submit">{% if produto %}Atualizar{% else %}Cadastrar{% endif %}</button>
        </form>
        
        <a href="/" class="cancelar">← Voltar para lista</a>
    </div>
</body>
</html>
